name: Hotel Cancellation ML Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and DVC pointers
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and DVC
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'dvc[s3]>=3,<4'
      - name: Pull versioned dataset from private S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: python -m dvc pull
      - name: Train and MLflow track experiments
        run: python train.py
      - name: Run model quality gate
        run: python scripts/quality_gate.py
      - name: Test API and model
        run: python -m pytest -q
      - name: Save model metrics for presentation
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: artifacts/metrics.json
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push versioned image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hotel-cancellation-api:build-${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hotel-cancellation-api:latest
