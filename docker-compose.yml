services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./predictions.csv:/app/predictions.csv
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
